name: Build UnityAssetEditor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: List available schemes
        run: xcodebuild -list -project UnityAssetEditor.xcodeproj

      - name: Build for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Compile unit tests for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Archive unsigned app
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/UnityAssetEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/UnityAssetEditor.xcarchive/Products/Applications/UnityAssetEditor.app"
          test -d "$APP"
          test -x "$APP/UnityAssetEditor"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "com.gira983.UnityAssetEditor"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/UnityAssetEditor-unsigned.ipa"
          unzip -t "$RUNNER_TEMP/UnityAssetEditor-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: UnityAssetEditor-unsigned-ipa
          path: ${{ runner.temp }}/UnityAssetEditor-unsigned.ipa
          if-no-files-found: error
