name: Build UnityAssetEditor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Select .NET 9 SDK and restore NativeAOT workload
        run: |
          set -euo pipefail
          sdk_version="$(dotnet --list-sdks | awk '$1 ~ /^9\./ {print $1}' | tail -n 1)"
          test -n "$sdk_version"
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch","allowPrerelease":false}}\n' "$sdk_version" > global.json
          dotnet --version
          dotnet workload restore Bridge/AssetToolsBridge.Native/AssetToolsBridge.Native.csproj

      - name: Verify upstream AssetsTools.NET APIs
        run: .github/scripts/inspect-assetstools-api.sh

      - name: Build managed AssetsTools worker
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Managed/AssetToolsBridge.Managed.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          --output "$RUNNER_TEMP/AssetsToolsBridgeManaged"

      - name: Build NativeAOT iOS bridge for device
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Native/AssetToolsBridge.Native.csproj
          --configuration Release
          --runtime ios-arm64
          --self-contained true
          -p:NativeLib=Shared
          -p:PublishAotUsingRuntimePack=true
          --output "$RUNNER_TEMP/AssetsToolsBridgeNative/ios-arm64"

      - name: Build NativeAOT iOS bridge for simulator
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Native/AssetToolsBridge.Native.csproj
          --configuration Release
          --runtime iossimulator-arm64
          --self-contained true
          -p:NativeLib=Shared
          -p:PublishAotUsingRuntimePack=true
          --output "$RUNNER_TEMP/AssetsToolsBridgeNative/iossimulator-arm64"

      - name: Package native bridge XCFramework
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bridge-frameworks/ios-arm64/UnityAssetEditorBridge.framework/Headers"
          mkdir -p "$RUNNER_TEMP/bridge-frameworks/ios-arm64/UnityAssetEditorBridge.framework/Modules"
          mkdir -p "$RUNNER_TEMP/bridge-frameworks/iossimulator-arm64/UnityAssetEditorBridge.framework/Headers"
          mkdir -p "$RUNNER_TEMP/bridge-frameworks/iossimulator-arm64/UnityAssetEditorBridge.framework/Modules"
          for platform in ios-arm64 iossimulator-arm64; do
            framework="$RUNNER_TEMP/bridge-frameworks/$platform/UnityAssetEditorBridge.framework"
            cp "$RUNNER_TEMP/AssetsToolsBridgeNative/$platform/AssetToolsBridge.Native.dylib" "$framework/UnityAssetEditorBridge"
            cp Bridge/Generated/UnityAssetEditorBridge.h "$framework/Headers/"
            cp Bridge/Generated/module.modulemap "$framework/Modules/module.modulemap"
            cat > "$framework/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>UnityAssetEditorBridge</string>
            <key>CFBundleIdentifier</key>
            <string>com.gira983.UnityAssetEditorBridge</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>UnityAssetEditorBridge</string>
            <key>CFBundlePackageType</key>
            <string>FMWK</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
          </dict>
          </plist>
          PLIST
            install_name_tool -rpath @executable_path @executable_path/Frameworks "$framework/UnityAssetEditorBridge"
            install_name_tool -id "@rpath/UnityAssetEditorBridge.framework/UnityAssetEditorBridge" "$framework/UnityAssetEditorBridge"
          done
          xcodebuild -create-xcframework \
            -framework "$RUNNER_TEMP/bridge-frameworks/ios-arm64/UnityAssetEditorBridge.framework" \
            -framework "$RUNNER_TEMP/bridge-frameworks/iossimulator-arm64/UnityAssetEditorBridge.framework" \
            -output "$RUNNER_TEMP/UnityAssetEditorBridge.xcframework"
          rm -rf Bridge/Build
          mkdir -p Bridge/Build
          cp -R "$RUNNER_TEMP/UnityAssetEditorBridge.xcframework" Bridge/Build/

      - name: Verify NativeAOT export
        run: |
          set -euo pipefail
          test -f "Bridge/Build/UnityAssetEditorBridge.xcframework/ios-arm64/UnityAssetEditorBridge.framework/UnityAssetEditorBridge"
          nm -gU "Bridge/Build/UnityAssetEditorBridge.xcframework/ios-arm64/UnityAssetEditorBridge.framework/UnityAssetEditorBridge" | grep -q 'uae_bridge_execute'

      - name: Run managed bridge smoke checks
        run: |
          set -euo pipefail
          WORKER="$RUNNER_TEMP/AssetsToolsBridgeManaged/AssetToolsBridge.Managed"
          FIXTURE="$RUNNER_TEMP/bridge-fixture.assets"
          python3 - "$FIXTURE" <<'PYTHON'
          import struct, sys
          path = sys.argv[1]
          data = bytearray(0x40)
          metadata = bytearray()
          metadata += b"2021.3.0f1\0"
          metadata += struct.pack(">I", 0)
          metadata += b"\x00"
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += b"\0"
          header_size = 48
          data_offset = header_size + len(metadata)
          file_size = data_offset
          data = bytearray(header_size)
          struct.pack_into(">I", data, 8, 22)
          data[16] = 0
          struct.pack_into(">I", data, 20, len(metadata))
          struct.pack_into(">q", data, 24, file_size)
          struct.pack_into(">q", data, 32, data_offset)
          data += metadata
          open(path, "wb").write(data)
          PYTHON
          "$WORKER" inspect "$FIXTURE" > "$RUNNER_TEMP/bridge-inspect.json"
          python3 - "$RUNNER_TEMP/bridge-inspect.json" <<'PYTHON'
          import json, sys
          inspect = json.load(open(sys.argv[1]))
          info = inspect["info"]
          assert info["kind"] == "serializedFile"
          assert info["assetCount"] == 0
          assert info["unityVersion"] == "2021.3.0f1"
          assert inspect["assets"] == []
          PYTHON

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Verify bridge sources are tracked
        run: |
          test -f Bridge/AssetToolsBridge.Managed/AssetToolsBridge.Managed.csproj
          test -f Bridge/AssetToolsBridge.Managed/Program.cs

      - name: List available schemes
        run: xcodebuild -list -project UnityAssetEditor.xcodeproj

      - name: Build for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Compile unit tests for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Archive unsigned app
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/UnityAssetEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Add TrollStore-compatible ad hoc signature
        run: |
          APP_PATH="$RUNNER_TEMP/UnityAssetEditor.xcarchive/Products/Applications/UnityAssetEditor.app"
          ENTITLEMENTS="$RUNNER_TEMP/empty.entitlements"
          cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          PLIST
          find "$APP_PATH/Frameworks" -type f -perm -111 -exec /usr/bin/codesign --force --sign - --timestamp=none {} \; || true
          /usr/bin/codesign --force --deep --sign - --timestamp=none --entitlements "$ENTITLEMENTS" "$APP_PATH"
          /usr/bin/codesign --verify --deep --verbose=4 "$APP_PATH"
          /usr/bin/codesign --display --verbose=4 "$APP_PATH"

      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/UnityAssetEditor.xcarchive/Products/Applications/UnityAssetEditor.app" "$RUNNER_TEMP/ipa/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/UnityAssetEditor.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UnityAssetEditor-ipa
          path: ${{ runner.temp }}/UnityAssetEditor.ipa
          if-no-files-found: error
