name: Build UnityAssetEditor

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-asset-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x

      - name: Select .NET 9 SDK and restore NativeAOT workload
        run: |
          set -euo pipefail
          sdk_version="$(dotnet --list-sdks | awk '$1 ~ /^9\./ {print $1}' | tail -n 1)"
          test -n "$sdk_version"
          printf '{"sdk":{"version":"%s","rollForward":"latestPatch","allowPrerelease":false}}\n' "$sdk_version" > global.json
          dotnet --version
          dotnet workload install mobile-librarybuilder

      - name: Verify upstream AssetsTools.NET APIs
        run: .github/scripts/inspect-assetstools-api.sh

      - name: Build managed AssetsTools worker
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Managed/AssetToolsBridge.Managed.csproj
          --configuration Release
          --runtime osx-arm64
          --self-contained true
          --output "$RUNNER_TEMP/AssetsToolsBridgeManaged"

      - name: Build NativeAOT iOS bridge for device
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Native/AssetToolsBridge.Native.csproj
          --configuration Release
          --runtime ios-arm64
          --self-contained true
          -p:NativeLib=Static
          -p:PublishAotUsingRuntimePack=true
          --output "$RUNNER_TEMP/AssetsToolsBridgeNative/ios-arm64"

      - name: Build NativeAOT iOS bridge for simulator
        run: >-
          dotnet publish Bridge/AssetToolsBridge.Native/AssetToolsBridge.Native.csproj
          --configuration Release
          --runtime iossimulator-arm64
          --self-contained true
          -p:NativeLib=Static
          -p:PublishAotUsingRuntimePack=true
          --output "$RUNNER_TEMP/AssetsToolsBridgeNative/iossimulator-arm64"

      - name: Package native bridge static libraries
        run: |
          set -euo pipefail
          mkdir -p Bridge/Build
          device_publish="$RUNNER_TEMP/AssetsToolsBridgeNative/ios-arm64"
          simulator_publish="$RUNNER_TEMP/AssetsToolsBridgeNative/iossimulator-arm64"
          runtime_bootstrap="$(find "$HOME/.nuget/packages" -type f -path '*/runtimes/ios-arm64/native/libbootstrapperdll.o' -print -quit)"
          test -n "$runtime_bootstrap"
          runtime_native_dir="$(dirname "$runtime_bootstrap")"
          echo "NativeAOT runtime directory: $runtime_native_dir"
          find "$device_publish" -maxdepth 1 -type f -print -exec ls -lh {} \;
          ar -t "$device_publish/AssetToolsBridge.Native.a" | head -40
          cp "$device_publish/AssetToolsBridge.Native.a" Bridge/Build/libUnityAssetEditorBridge.a
          cp "$simulator_publish/AssetToolsBridge.Native.a" Bridge/Build/libUnityAssetEditorBridge-simulator.a
          for name in \
            libbootstrapperdll.o \
            libRuntime.WorkstationGC.a \
            libeventpipe-disabled.a \
            libRuntime.VxsortDisabled.a \
            libstandalonegc-disabled.a \
            libaotminipal.a \
            libstdc++compat.a \
            libSystem.Native.a \
            libSystem.IO.Compression.Native.a \
            libSystem.Security.Cryptography.Native.Apple.a; do
            test -f "$runtime_native_dir/$name"
            cp "$runtime_native_dir/$name" "Bridge/Build/$name"
          done
          find Bridge/Build -maxdepth 1 -type f -print -exec ls -lh {} \;
          nm -gU Bridge/Build/libUnityAssetEditorBridge.a > "$RUNNER_TEMP/bridge-symbols.txt"
          grep -q 'uae_bridge_execute' "$RUNNER_TEMP/bridge-symbols.txt"

      - name: Verify NativeAOT export
        run: |
          set -euo pipefail
          test -f Bridge/Build/libUnityAssetEditorBridge.a
          nm -gU Bridge/Build/libUnityAssetEditorBridge.a > "$RUNNER_TEMP/bridge-symbols.txt"
          grep -q 'uae_bridge_execute' "$RUNNER_TEMP/bridge-symbols.txt"

      - name: Run managed bridge smoke checks
        run: |
          set -euo pipefail
          WORKER="$RUNNER_TEMP/AssetsToolsBridgeManaged/AssetToolsBridge.Managed"
          FIXTURE="$RUNNER_TEMP/bridge-fixture.assets"
          python3 - "$FIXTURE" <<'PYTHON'
          import struct, sys
          path = sys.argv[1]
          data = bytearray(0x40)
          metadata = bytearray()
          metadata += b"2021.3.0f1\0"
          metadata += struct.pack(">I", 0)
          metadata += b"\x00"
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += struct.pack(">I", 0)
          metadata += b"\0"
          header_size = 48
          data_offset = header_size + len(metadata)
          file_size = data_offset
          data = bytearray(header_size)
          struct.pack_into(">I", data, 8, 22)
          data[16] = 0
          struct.pack_into(">I", data, 20, len(metadata))
          struct.pack_into(">q", data, 24, file_size)
          struct.pack_into(">q", data, 32, data_offset)
          data += metadata
          open(path, "wb").write(data)
          PYTHON
          "$WORKER" inspect "$FIXTURE" > "$RUNNER_TEMP/bridge-inspect.json"
          python3 - "$RUNNER_TEMP/bridge-inspect.json" <<'PYTHON'
          import json, sys
          response = json.load(open(sys.argv[1]))
          assert response["ok"] is True
          inspect = response["result"]
          info = inspect["info"]
          assert info["kind"] == "serializedFile"
          assert info["assetCount"] == 0
          assert info["unityVersion"] == "2021.3.0f1"
          assert inspect["assets"] == []
          PYTHON

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version

      - name: Verify bridge sources are tracked
        run: |
          test -f Bridge/AssetToolsBridge.Managed/AssetToolsBridge.Managed.csproj
          test -f Bridge/AssetToolsBridge.Managed/Program.cs

      - name: List available schemes
        run: xcodebuild -list -project UnityAssetEditor.xcodeproj

      - name: Build for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build

      - name: Compile unit tests for iOS device
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Archive unsigned app
        run: >-
          xcodebuild
          -project UnityAssetEditor.xcodeproj
          -scheme UnityAssetEditor
          -sdk iphoneos
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/UnityAssetEditor.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Add TrollStore-compatible ad hoc signature
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/UnityAssetEditor.xcarchive/Products/Applications/UnityAssetEditor.app"
          ENTITLEMENTS="$RUNNER_TEMP/empty.entitlements"
          cat > "$ENTITLEMENTS" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          PLIST
          /usr/bin/codesign --force --sign - --timestamp=none --entitlements "$ENTITLEMENTS" "$APP_PATH"
          /usr/bin/codesign --verify --strict --deep --verbose=4 "$APP_PATH"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/UnityAssetEditor.xcarchive/Products/Applications/UnityAssetEditor.app"
          test -x "$APP_PATH/UnityAssetEditor"
          test ! -d "$APP_PATH/Frameworks"
          /usr/bin/codesign --verify --strict --deep "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/UnityAssetEditor.ipa"
          unzip -Z1 "$RUNNER_TEMP/UnityAssetEditor.ipa" | grep -q 'Payload/UnityAssetEditor.app/UnityAssetEditor'
          if unzip -Z1 "$RUNNER_TEMP/UnityAssetEditor.ipa" | grep -q 'Payload/UnityAssetEditor.app/Frameworks/'; then
            echo 'Unexpected embedded dynamic framework remains in IPA'
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/ipa-verify"
          mkdir -p "$RUNNER_TEMP/ipa-verify"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/UnityAssetEditor.ipa" "$RUNNER_TEMP/ipa-verify"
          /usr/bin/codesign --verify --strict --deep "$RUNNER_TEMP/ipa-verify/Payload/UnityAssetEditor.app"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: UnityAssetEditor-ipa
          path: ${{ runner.temp }}/UnityAssetEditor.ipa
          if-no-files-found: error
